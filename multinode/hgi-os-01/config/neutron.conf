# Nexus: Neutron settings.
#
# Merge into <configdir>/config/neutron.conf (create it if it does not exist; keep any settings
# already in it, such as an MTU), then:
#   kolla-ansible reconfigure -i <inventory> --tags neutron [--configdir <configdir>]

[oslo_policy]
# What: Neutron's secure-RBAC defaults and scope checking.
# Why Nexus needs it: the same reason as Cinder's — `reader` must not be able to write. Required
# on Neutron before 2023.2. Checked by `rbac.reader_cannot_write`.
enforce_new_defaults = True
enforce_scope = True

[oslo_messaging_notifications]
# What: emits Neutron notifications.
# Why Nexus needs it: exact usage boundaries for addresses and ports (see cinder.conf).
driver = messagingv2

# No `[service_user]`: Neutron does not read that section, so a setting there does nothing.

[DEFAULT]
# This cloud: its overlay networks run inside another cloud, so the physical MTU is the outer one.
global_physnet_mtu = 8950
