# Nexus: Nova settings.
#
# Merge into <configdir>/config/nova.conf (create it if it does not exist; keep any settings
# already in it), then:
#   kolla-ansible reconfigure -i <inventory> --tags nova [--configdir <configdir>]

[notifications]
# What: emits versioned notifications. Nova's default is the legacy unversioned format only.
# Why Nexus needs it: Nexus's metering consumer reads versioned payloads. The legacy format omits
# fields it needs and has no stability guarantee, so an unversioned cloud cannot produce
# billing-grade usage — its usage stays provisional.
# `both` keeps the legacy ones too. Use it if anything else on the cloud reads them — Ceilometer
# does, and Kolla-Ansible deploys it with `enable_ceilometer`. With nothing else reading them,
# `versioned` halves the notification traffic.
notification_format = both

# Service tokens: Kolla-Ansible already renders Nova's `[service_user]` section, with its
# credentials, and turns them on. On another deployment tool, check that `[service_user]` has
# `send_service_user_token = true` *and* the service user's credentials: instance builds, resizes
# and migrations routinely outlive a one-hour user token and fail without them.

# --- Retention: not a setting, but a commitment ------------------------------
# Nexus reconstructs billable hours from Nova's instance actions and deleted rows. If deleted rows
# are archived or purged sooner than 30 days, those hours are gone and cannot be recomputed —
# a gap Nexus will report but cannot fill.
#   Run `nova-manage db archive_deleted_rows --before <at least 30 days ago>`, never with a
#   shorter window, and keep the archive until usage for that period is closed.
