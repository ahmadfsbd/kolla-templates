# Nexus (hgi-os-01): Cinder's secure RBAC defaults (E16 restoration, owner approval 2026-10-02).
# With them a project reader cannot create, extend or delete volumes (probe
# rbac.reader_cannot_write); Cinder's defaults are project-scoped only.
#
# Nexus: Cinder settings.
#
# Merge into <configdir>/config/cinder.conf (create it if it does not exist; keep any settings
# already in it), then:
#   kolla-ansible reconfigure -i <inventory> --tags cinder [--configdir <configdir>]

[oslo_policy]
# What: turns on Cinder's secure-RBAC policy defaults and scope checking.
# Why Nexus needs it: without them, a project *reader* can create, extend and delete volumes.
# Nexus grants `reader` to people who should only be able to look, and grants it to its own
# inventory identity — so on a cloud with the legacy defaults, a read-only grant is not read-only.
# Required on Cinder before 2026.2, where these are not yet the default.
# Checked by `rbac.reader_cannot_write`; a cloud that fails it has block storage switched off.
enforce_new_defaults = True
enforce_scope = True

[oslo_messaging_notifications]
# What: emits Cinder notifications onto the message bus.
# Why Nexus needs it: usage is reconstructed from a resource-interval ledger. Polling alone gives
# bounded (approximate) interval ends; notifications make them exact, which is what billing-grade
# usage requires. Without them, usage stays labelled provisional.
driver = messagingv2

[service_user]
# What: lets Cinder present its own service token alongside the user's.
# Why Nexus needs it: a long operation (a large volume copy) can outlive the user token that
# started it, and then fails near the end. The service token keeps it authorised.
# The credentials are required, not optional: with `send_service_user_token = true` and no
# `auth_type`, Cinder raises ServiceUserTokenNoAuth on every call that uses it. Kolla-Ansible does
# not render this section for Cinder (it does for Nova), so it is written in full here, with
# Kolla's own variables: the file is a Jinja template and no password appears in it.
send_service_user_token = true
auth_url = {{ keystone_internal_url }}
auth_type = password
project_domain_id = {{ default_project_domain_id }}
user_domain_id = {{ default_user_domain_id }}
project_name = service
username = {{ cinder_keystone_user }}
password = {{ cinder_keystone_password }}
cafile = {{ openstack_cacert }}
region_name = {{ openstack_region_name }}
valid_interfaces = internal
