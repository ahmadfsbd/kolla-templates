# Lab 1 lockdown of Magnum (authorised 2026-10-01): not offered on this lab (spec 004 §9), so
# customers may not create or change anything through it until its Phase 2 support. Only the
# rules below change; every other rule keeps its upstream 2026.1 default (generated from the
# running magnum_api container with oslopolicy-sample-generator). Reads stay as upstream.
# Copy to /etc/kolla/config/magnum/policy.yaml. Proved by lockdown.non_offered (container-infrastructure-management).

