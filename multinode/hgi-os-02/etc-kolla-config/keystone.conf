# Copy to /etc/kolla/config/keystone.conf on the deploy host, then:
#   kolla-ansible reconfigure -i multinode --tags keystone
[federation]
# 7 days: lets Heat/Magnum trusts work for people (Q14, ADR-0003).
default_authorization_ttl = 10080

[token]
# Keystone default, stated explicitly: it bounds revocation during a broker-to-cloud partition.
expiration = 3600
