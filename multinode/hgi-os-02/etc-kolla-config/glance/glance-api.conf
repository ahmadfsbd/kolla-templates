# Glance unified limits on lab 1 (authorised 2026-10-01): image quotas from Keystone limits, so
# Nexus can bound each project's images (quota translation v1: image_count_total,
# image_size_total; the other two only have registered defaults). Copy to
# /etc/kolla/config/glance/glance-api.conf. Kolla renders this file as a template: the password
# is Kolla's own variable and never appears here.
#
# Prerequisites (the onboarding kit's glance_limits role): the glance service user holds `reader`
# on the system scope, and registered limits exist for all four Glance resources in this region
# (without one, oslo.limit treats the resource as limited to 0 and refuses every upload).
[DEFAULT]
use_keystone_limits = True

[oslo_limit]
auth_type = password
auth_url = {{ keystone_internal_url }}
user_domain_id = {{ default_user_domain_id }}
username = {{ glance_keystone_user }}
password = {{ glance_keystone_password }}
system_scope = all
cafile = {{ openstack_cacert }}
endpoint_service_type = image
endpoint_region_name = {{ openstack_region_name }}
endpoint_interface = internal
